name: mobile

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK / NDK
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.0.12077973" || \
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Init android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            cargo tauri android init --ci
          fi

      - name: Build apk
        run: cargo tauri android build --apk --ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gen-android
          path: src-tauri/gen/android
          if-no-files-found: warn

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Init ios project
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            cargo tauri ios init --ci
          fi

      - name: Build unsigned ipa
        run: cargo tauri ios build --no-sign --ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gen-apple
          path: src-tauri/gen/apple
          if-no-files-found: warn
