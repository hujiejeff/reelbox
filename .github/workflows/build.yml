name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- 桌面:Windows / macOS / Linux ----------
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Test core
        run: cargo test -p reelbox-core

      - name: Portable zip (exe only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          Copy-Item target/release/reelbox.exe dist-portable/
          Copy-Item README.md dist-portable/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist-portable/* -DestinationPath "Reelbox_${v}_portable_x64.zip"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Reelbox v__VERSION__"
          releaseBody: "见提交记录。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Attach portable zip
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: Reelbox_*_portable_x64.zip

  # ---------- Android ----------
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK / NDK
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2

      - name: Signing setup
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名 secret,本次出 debug 包"
            exit 0
          fi
          echo "has=true" >> "$GITHUB_OUTPUT"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/reelbox.p12"
          echo "KS_PATH=$RUNNER_TEMP/reelbox.p12" >> "$GITHUB_ENV"

      - name: Init android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi

      - name: Patch gradle signing
        if: steps.sign.outputs.has == 'true'
        run: |
          G=src-tauri/gen/android/app/build.gradle.kts
          cat >> "$G" <<'KTS'

          // ---- CI 注入:release 签名 + 允许明文(本地反代 127.0.0.1) ----
          android {
              signingConfigs {
                  create("ciRelease") {
                      storeFile = file(System.getenv("KS_PATH")!!)
                      storeType = "PKCS12"
                      storePassword = System.getenv("KS_PASSWORD")
                      keyAlias = System.getenv("KS_ALIAS")
                      keyPassword = System.getenv("KS_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("ciRelease")
                      manifestPlaceholders["usesCleartextTraffic"] = "true"
                  }
              }
          }
          KTS

      - name: Build apk (release, signed)
        if: steps.sign.outputs.has == 'true'
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: npx tauri android build --apk --ci

      - name: Build apk (debug, unsigned)
        if: steps.sign.outputs.has != 'true'
        run: npx tauri android build --apk --debug --ci

      - name: Attach apk
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ---------- iOS ----------
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2

      - name: Init ios project
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npx tauri ios init --ci
          fi

      - name: Build unsigned ipa
        run: npx tauri ios build --no-sign --ci

      - name: Attach ipa
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/gen/apple/build/**/*.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn
