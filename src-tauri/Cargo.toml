[package]
license = "MIT"
name = "reelbox"
version = "0.2.0"
description = "Reelbox — 全平台影视资源解析播放器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reelbox_lib"
# 三种产物都要:
#   staticlib —— iOS(iOS 只能静态链接)
#   cdylib    —— Android(lib<name>.so)
#   rlib      —— 桌面(MinGW 下 cdylib 会因导出序号超限而链接失败,而桌面可执行文件只需要 rlib)
# 注意:crate-type 不能按 target 分别配置,所以三个一起留着。
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reelbox-core = { path = "../core" }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# 兼容老播放地址 `/p?u=…&h=…` 用(新地址是 `/s/<id>`,不再编码任何东西)
base64 = "0.22"
# m3u8 里的相对地址按 RFC 3986 解析(`../`、协议相对、查询串)。
# 版本必须和 core 里 reqwest 依赖的那份一致,否则会各编一份 —— 改动前先跑 `cargo tree -i url`
url = "2"
# 网络统一走 core 里的 reqwest(见 reelbox_core::net),这里不再引第二套 HTTP 栈
