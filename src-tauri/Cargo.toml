[package]
license = "MIT"
name = "reelbox"
version = "0.1.0"
description = "Reelbox — 全平台影视资源解析播放器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reelbox_lib"
# 三种产物都要:
#   staticlib —— iOS(iOS 只能静态链接)
#   cdylib    —— Android(lib<name>.so)
#   rlib      —— 桌面(MinGW 下 cdylib 会因导出序号超限而链接失败,而桌面可执行文件只需要 rlib)
# 注意:crate-type 不能按 target 分别配置,所以三个一起留着。
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reelbox-core = { path = "../core" }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }
