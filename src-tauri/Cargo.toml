[package]
license = "MIT"
name = "reelbox"
version = "0.4.1"
description = "Reelbox — 全平台影视资源解析播放器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reelbox_lib"
# 三种产物都要:
#   staticlib —— iOS(iOS 只能静态链接)
#   cdylib    —— Android(lib<name>.so)
#   rlib      —— 桌面(MinGW 下 cdylib 会因导出序号超限而链接失败,而桌面可执行文件只需要 rlib)
# 注意:crate-type 不能按 target 分别配置,所以三个一起留着。
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
reelbox-core = { path = "../core" }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# 兼容老播放地址 `/p?u=…&h=…` 用(新地址是 `/s/<id>`,不再编码任何东西)
base64 = "0.22"
# m3u8 改写与地址补全在 core(见 core/src/playlist.rs),那边的测试能在本机真跑,
# 所以这里不再直接依赖 url;网络统一走 core 里的 reqwest(见 reelbox_core::net),不引第二套 HTTP 栈
