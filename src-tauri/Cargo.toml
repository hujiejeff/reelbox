[package]
license = "MIT"
name = "reelbox"
version = "0.1.0"
description = "Reelbox — 全平台影视资源解析播放器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reelbox_lib"
# MinGW 链接 cdylib 时会因导出序号超限失败;桌面只需要 rlib。
# 以后做移动端再按需加回 staticlib/cdylib。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reelbox-core = { path = "../core" }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }
