[package]
name = "reelbox"
version = "0.1.0"
description = "Reelbox — 全平台影视资源解析播放器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reelbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
