[package]
name = "reelbox-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
quick-xml = { version = "0.36", features = ["serialize"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png", "gif"] }
boa_engine = "0.22.0"
