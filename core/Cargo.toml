[package]
license = "MIT"
name = "reelbox-core"
version = "0.3.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 网络层统一走 reqwest(可设超时/代理、跟重定向、能拿最终地址)。
# TLS 用 rustls + ring:Android/iOS/Linux 都能交叉编译,不依赖系统 OpenSSL。
# `rustls-no-provider` 只带 TLS 接线,加密后端由下面的 rustls 依赖装(见 net::http::init_crypto)。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "http2", "charset", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
quick-xml = { version = "0.36", features = ["serialize"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png", "gif"] }
boa_engine = "0.22.0"
# m3u8 里的相对地址按 RFC 3986 解析(`../`、协议相对、查询串),见 playlist::resolve。
# 版本必须和 reqwest 依赖的那份一致,否则会各编一份 —— 改动前先跑 `cargo tree -i url`
url = "2"
sha2 = "0.10"
