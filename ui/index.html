<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reelbox</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    background: #0b0b0d; color: #e8e8ea;
    font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
  }
  .box { text-align: center; max-width: 520px; padding: 0 24px; }
  h1 { font-size: 34px; letter-spacing: .5px; margin: 0 0 12px; }
  p { color: #9a9aa2; margin: 6px 0; }
  code { background: #17171a; padding: 2px 6px; border-radius: 6px; color: #c8c8d0; }
</style>
</head>
<body>
  <div class="box">
    <h1>Reelbox</h1>
    <p>Tauri 外壳已经起来了。</p>
    <p>后端还没接：接 Go 边车就把窗口指向 <code>http://127.0.0.1:8787</code>，<br>接 Rust 就把解析层搬进 <code>src-tauri/src</code>。</p>
  </div>
</body>
</html>
