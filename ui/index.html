<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reelbox</title>
<link rel="stylesheet" href="vendor/m3e.css">
<style>
  @font-face {
    font-family: "Material Symbols Outlined";
    font-style: normal;
    font-weight: 100 700;
    src: url("vendor/material-symbols.woff2") format("woff2");
  }
  .m3e-icon {
    font-family: "Material Symbols Outlined", sans-serif;
    font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
    letter-spacing: normal; text-transform: none; display: inline-block;
    white-space: nowrap; direction: ltr;
    font-feature-settings: "liga";
    -webkit-font-feature-settings: "liga";
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--m3e-sys-color-surface);
    color: var(--m3e-sys-color-on-surface);
    font-family: system-ui, "Segoe UI", "PingFang SC", sans-serif;
    overflow: hidden;
  }

  /* 三档窗口:compact <600 / medium 600-840 / expanded >=840 */
  .app { display: flex; flex-direction: column; height: 100vh; }
  .body { display: flex; flex: 1; min-height: 0; }

  .rail { flex: none; display: none; }
  .rail__grow { flex: 1; }
  .bottombar { flex: none; display: flex; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 16px 4px;
  }
  .src-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 44px; padding: 0 12px 0 14px; border: none; cursor: pointer;
    border-radius: 22px; background: transparent; color: inherit;
    font: 600 17px/1 system-ui, "PingFang SC", sans-serif;
  }
  .src-btn:hover { background: var(--m3e-sys-color-surface-container-high); }
  .src-btn .m3e-icon { font-size: 20px; color: var(--m3e-sys-color-on-surface-variant); }
  .srcmenu {
    position: absolute; z-index: 20; min-width: 220px; padding: 8px;
    border-radius: 20px; display: none;
    background: var(--m3e-sys-color-surface-container);
    box-shadow: 0 8px 28px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.10);
  }
  .srcmenu[data-open] { display: block; }
  .srcmenu button {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; height: 48px; padding: 0 14px; border: none; cursor: pointer;
    border-radius: 14px; background: transparent; color: inherit;
    font: 500 14px/1 system-ui, "PingFang SC", sans-serif; text-align: left;
  }
  .srcmenu button:hover { background: var(--m3e-sys-color-surface-container-highest); }
  .srcmenu button[aria-checked="true"] { background: var(--m3e-sys-color-secondary-container); }
  .srcmenu .m3e-icon { font-size: 20px; }

  .toolbar { flex: none; display: flex; gap: 12px; align-items: center; padding: 6px 16px 12px; }
  .searchbox {
    flex: 1; display: flex; align-items: center; gap: 10px; height: 52px;
    padding: 0 18px; border-radius: 26px; min-width: 0;
    background: var(--m3e-sys-color-surface-container-high);
    color: var(--m3e-sys-color-on-surface-variant);
  }
  .searchbox .m3e-icon { font-size: 22px; }

  .chips {
    flex: none; display: flex; gap: 8px; padding: 0 16px 12px;
    overflow-x: auto; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .m3e-filter-chip { flex: none; }

  .scroll { flex: 1; overflow-y: auto; padding: 0 16px 96px; }
  .grid {
    display: grid; gap: 18px 16px;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  }
  .card { cursor: pointer; }
  .poster {
    aspect-ratio: 2 / 3; border-radius: 18px;
    background: linear-gradient(160deg,
      hsl(calc(212deg + var(--h, 0deg)) 40% 50%),
      hsl(calc(258deg + var(--h, 0deg)) 46% 22%));
    transition: transform .18s cubic-bezier(.2,.9,.3,1.2), box-shadow .18s ease;
  }
  .card:hover .poster { transform: translateY(-3px) scale(1.015); box-shadow: 0 10px 24px rgba(0,0,0,.16); }
  .meta { padding: 9px 2px 0; display: flex; flex-direction: column; gap: 3px; }
  .meta b { font-size: 13px; font-weight: 600; }
  .meta span { font-size: 12px; color: var(--m3e-sys-color-on-surface-variant); }

  .empty { padding: 48px 8px; color: var(--m3e-sys-color-on-surface-variant); }

  /* medium: 图标栏 */
  @media (min-width: 600px) {
    .bottombar { display: none; }
    .rail { display: flex; width: 84px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
    .scroll { padding-bottom: 32px; }
  }
  /* expanded: 完整导航栏 */
  @media (min-width: 840px) {
    .rail { width: 112px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .topbar { padding: 12px 24px 4px; }
    .toolbar, .chips { padding-inline: 24px; }
    .scroll { padding-inline: 24px; }
  }
  @media (min-width: 1280px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="body">
    <nav class="m3e-navigation-rail rail" aria-label="主导航">
      <button type="button" class="m3e-navigation-item" data-nav="movie">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">movie</span>
          <span class="m3e-navigation-item__label">电影</span>
        </span>
      </button>
      <button type="button" class="m3e-navigation-item" data-nav="tv">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">live_tv</span>
          <span class="m3e-navigation-item__label">连续剧</span>
        </span>
      </button>
      <button type="button" class="m3e-navigation-item" data-nav="show">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">celebration</span>
          <span class="m3e-navigation-item__label">综艺</span>
        </span>
      </button>
      <button type="button" class="m3e-navigation-item" data-nav="anime">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">animation</span>
          <span class="m3e-navigation-item__label">动漫</span>
        </span>
      </button>
      <div class="rail__grow"></div>
      <button type="button" class="m3e-navigation-item" data-nav="fav">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">favorite</span>
          <span class="m3e-navigation-item__label">喜欢</span>
        </span>
      </button>
      <button type="button" class="m3e-navigation-item" data-nav="settings">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">settings</span>
          <span class="m3e-navigation-item__label">设置</span>
        </span>
      </button>
    </nav>

    <div class="main">
      <header class="topbar">
        <button class="src-btn" id="srcBtn" aria-haspopup="true" aria-expanded="false">
          <span id="srcName">非凡资源</span>
          <span class="m3e-icon" aria-hidden="true">arrow_drop_down</span>
        </button>
        <div class="srcmenu" id="srcMenu" role="menu">
          <button role="menuitemradio" aria-checked="true" data-src="ffzy">非凡资源<span class="m3e-icon">check</span></button>
          <button role="menuitemradio" aria-checked="false" data-src="dytt">电影天堂<span class="m3e-icon"></span></button>
          <button role="menuitemradio" aria-checked="false" data-src="lzzy">量子资源<span class="m3e-icon"></span></button>
        </div>
        <div style="flex:1"></div>
        <button class="m3e-icon-button m3e-icon-button--filled" id="cfgBtn" aria-label="设置" style="display:none">
          <span class="m3e-icon" aria-hidden="true">settings</span>
        </button>
      </header>

      <div class="toolbar">
        <div class="searchbox">
          <span class="m3e-icon" aria-hidden="true">search</span>
          <span>搜索影片</span>
        </div>
        <button class="m3e-button m3e-button--filled m3e-button--size-m" type="button">筛选</button>
      </div>

      <div class="chips">
        <button class="m3e-filter-chip" type="button" aria-selected="true">全部</button>
        <button class="m3e-filter-chip" type="button">动作片</button>
        <button class="m3e-filter-chip" type="button">喜剧片</button>
        <button class="m3e-filter-chip" type="button">科幻片</button>
        <button class="m3e-filter-chip" type="button">恐怖片</button>
        <button class="m3e-filter-chip" type="button">剧情片</button>
      </div>

      <div class="scroll">
        <div class="grid" id="grid">
        <article class="card" data-id="0">
          <div class="poster" style="--h:0deg"></div>
          <div class="meta"><b>片名 1</b><span>更新至第3集</span></div>
        </article>
        <article class="card" data-id="1">
          <div class="poster" style="--h:11deg"></div>
          <div class="meta"><b>片名 2</b><span>更新至第4集</span></div>
        </article>
        <article class="card" data-id="2">
          <div class="poster" style="--h:22deg"></div>
          <div class="meta"><b>片名 3</b><span>更新至第5集</span></div>
        </article>
        <article class="card" data-id="3">
          <div class="poster" style="--h:33deg"></div>
          <div class="meta"><b>片名 4</b><span>更新至第6集</span></div>
        </article>
        <article class="card" data-id="4">
          <div class="poster" style="--h:44deg"></div>
          <div class="meta"><b>片名 5</b><span>更新至第7集</span></div>
        </article>
        <article class="card" data-id="5">
          <div class="poster" style="--h:55deg"></div>
          <div class="meta"><b>片名 6</b><span>更新至第8集</span></div>
        </article>
        <article class="card" data-id="6">
          <div class="poster" style="--h:0deg"></div>
          <div class="meta"><b>片名 7</b><span>更新至第9集</span></div>
        </article>
        <article class="card" data-id="7">
          <div class="poster" style="--h:11deg"></div>
          <div class="meta"><b>片名 8</b><span>更新至第10集</span></div>
        </article>
        <article class="card" data-id="8">
          <div class="poster" style="--h:22deg"></div>
          <div class="meta"><b>片名 9</b><span>更新至第11集</span></div>
        </article>
        <article class="card" data-id="9">
          <div class="poster" style="--h:33deg"></div>
          <div class="meta"><b>片名 10</b><span>更新至第12集</span></div>
        </article>
        <article class="card" data-id="10">
          <div class="poster" style="--h:44deg"></div>
          <div class="meta"><b>片名 11</b><span>更新至第13集</span></div>
        </article>
        <article class="card" data-id="11">
          <div class="poster" style="--h:55deg"></div>
          <div class="meta"><b>片名 12</b><span>更新至第14集</span></div>
        </article>
        <article class="card" data-id="12">
          <div class="poster" style="--h:0deg"></div>
          <div class="meta"><b>片名 13</b><span>更新至第15集</span></div>
        </article>
        <article class="card" data-id="13">
          <div class="poster" style="--h:11deg"></div>
          <div class="meta"><b>片名 14</b><span>更新至第16集</span></div>
        </article>
        <article class="card" data-id="14">
          <div class="poster" style="--h:22deg"></div>
          <div class="meta"><b>片名 15</b><span>更新至第17集</span></div>
        </article>
        <article class="card" data-id="15">
          <div class="poster" style="--h:33deg"></div>
          <div class="meta"><b>片名 16</b><span>更新至第18集</span></div>
        </article>
        <article class="card" data-id="16">
          <div class="poster" style="--h:44deg"></div>
          <div class="meta"><b>片名 17</b><span>更新至第19集</span></div>
        </article>
        <article class="card" data-id="17">
          <div class="poster" style="--h:55deg"></div>
          <div class="meta"><b>片名 18</b><span>更新至第20集</span></div>
        </article>
        </div>
        <div class="empty" id="empty" style="display:none">这里还没有内容</div>
      </div>
    </div>
  </div>

  <nav class="m3e-navigation-bar bottombar" aria-label="主导航">
      <button type="button" class="m3e-navigation-item" data-nav="movie">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">movie</span>
          <span class="m3e-navigation-item__label">电影</span>
        </span>
      </button>
      <button type="button" class="m3e-navigation-item" data-nav="tv">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">live_tv</span>
          <span class="m3e-navigation-item__label">连续剧</span>
        </span>
      </button>
      <button type="button" class="m3e-navigation-item" data-nav="show">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">celebration</span>
          <span class="m3e-navigation-item__label">综艺</span>
        </span>
      </button>
      <button type="button" class="m3e-navigation-item" data-nav="anime">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">animation</span>
          <span class="m3e-navigation-item__label">动漫</span>
        </span>
      </button>
      <button type="button" class="m3e-navigation-item" data-nav="fav">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">favorite</span>
          <span class="m3e-navigation-item__label">喜欢</span>
        </span>
      </button>
  </nav>
</div>

<script>
(function () {
  var btn = document.getElementById("srcBtn");
  var menu = document.getElementById("srcMenu");
  var name = document.getElementById("srcName");

  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = menu.hasAttribute("data-open");
    if (open) { menu.removeAttribute("data-open"); btn.setAttribute("aria-expanded","false"); }
    else {
      var r = btn.getBoundingClientRect();
      menu.style.left = r.left + "px";
      menu.style.top = (r.bottom + 6) + "px";
      menu.setAttribute("data-open", "");
      btn.setAttribute("aria-expanded","true");
    }
  });

  menu.addEventListener("click", function (e) {
    var item = e.target.closest("button[data-src]");
    if (!item) return;
    name.textContent = item.textContent.replace(/\s+/g, " ").replace(" check","").trim();
    menu.querySelectorAll("button[data-src]").forEach(function (b) {
      var on = b === item;
      b.setAttribute("aria-checked", on ? "true" : "false");
      b.querySelector(".m3e-icon").textContent = on ? "check" : "";
    });
    menu.removeAttribute("data-open");
    btn.setAttribute("aria-expanded","false");
  });

  document.addEventListener("click", function () {
    menu.removeAttribute("data-open");
    btn.setAttribute("aria-expanded","false");
  });

  // 导航选中态:三处 rail / bar 同步
  document.querySelectorAll("[data-nav]").forEach(function (el) {
    el.addEventListener("click", function () {
      var key = el.getAttribute("data-nav");
      document.querySelectorAll("[data-nav]").forEach(function (o) {
        var on = o.getAttribute("data-nav") === key;
        if (on) o.setAttribute("aria-current", "page");
        else o.removeAttribute("aria-current");
      });
      var fav = key === "fav" || key === "settings";
      document.getElementById("grid").style.display = fav ? "none" : "";
      document.getElementById("empty").style.display = fav ? "" : "none";
    });
  });

  // compact 下把设置放到顶栏
  var cfg = document.getElementById("cfgBtn");
  function syncCompact() {
    cfg.style.display = window.matchMedia("(max-width: 599px)").matches ? "" : "none";
  }
  syncCompact();
  window.addEventListener("resize", syncCompact);
})();
</script>
</body>
</html>
