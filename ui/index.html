<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reelbox</title>
<link rel="stylesheet" href="vendor/m3e.css">
<style>
  @font-face { font-family: "Material Symbols Outlined"; font-style: normal; font-weight: 100 700;
    src: url("vendor/material-symbols.woff2") format("woff2"); }
  .m3e-icon { font-family: "Material Symbols Outlined", sans-serif; font-weight: normal; font-style: normal;
    font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block;
    white-space: nowrap; direction: ltr; font-feature-settings: "liga"; -webkit-font-feature-settings: "liga"; }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--m3e-sys-color-surface); color: var(--m3e-sys-color-on-surface);
    font-family: system-ui, "Segoe UI", "PingFang SC", sans-serif; overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }
  @media (max-width: 599px) { .scroll { padding-bottom: 104px; } }
  .body { display: flex; flex: 1; min-height: 0; }

  .rail { flex: none; display: none; }
  .rail__grow { flex: 1; }
  /* 窄屏:官方 floating toolbar(纯图标) */
  .float-tabs {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30;
  }
  .float-tabs .m3e-floating-toolbar__bar { border-radius: 999px; }
  .float-tabs .m3e-icon-button[aria-current="page"] {
    background: var(--m3e-sys-color-secondary-container);
    color: var(--m3e-sys-color-on-secondary-container);
  }
  @media (min-width: 600px) { .float-tabs { display: none; } }

  /* 桌面:一列侧栏,导航和分类在同一列 */
  .side { flex: none; display: none; width: 232px; flex-direction: column;
    background: var(--m3e-sys-color-surface-container-low);
    border-inline-end: 1px solid var(--m3e-sys-color-outline-variant); }
  .side__brand { font: 800 15px/1 system-ui; letter-spacing: .2px; padding: 18px 20px 10px; }
  .side__nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 8px; }
  .side__item { display: flex; align-items: center; gap: 14px; height: 46px; padding: 0 16px;
    border: none; cursor: pointer; border-radius: 23px; background: transparent; color: inherit;
    font: 600 14px/1 system-ui, "PingFang SC", sans-serif; }
  .side__item .m3e-icon { font-size: 22px; color: var(--m3e-sys-color-on-surface-variant); }
  .side__item:hover { background: var(--m3e-sys-color-surface-container-high); }
  .side__item[aria-current="page"] { background: var(--m3e-sys-color-secondary-container);
    color: var(--m3e-sys-color-on-secondary-container); }
  .side__item[aria-current="page"] .m3e-icon { color: inherit; }
  .side__divider { height: 1px; margin: 6px 20px 10px; background: var(--m3e-sys-color-outline-variant); }
  .side__scroll { flex: 1; overflow-y: auto; padding: 0 8px 20px; scrollbar-width: none; }
  .side__scroll::-webkit-scrollbar { display: none; }
  .catgroup { font: 600 11px/1 system-ui; letter-spacing: .06em; text-transform: uppercase;
    color: var(--m3e-sys-color-on-surface-variant); padding: 16px 12px 6px; }
  .cat { display: block; width: 100%; text-align: left; border: none; cursor: pointer;
    height: 40px; padding: 0 12px; border-radius: 20px; background: transparent; color: inherit;
    font: 500 14px/1 system-ui, "PingFang SC", sans-serif; }
  .cat:hover { background: var(--m3e-sys-color-surface-container-high); }
  .cat[aria-selected="true"] { background: var(--m3e-sys-color-secondary-container);
    color: var(--m3e-sys-color-on-secondary-container); }
  .cat--child { padding-left: 24px; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px 4px; }
  .src-btn { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px 0 14px;
    border: none; cursor: pointer; border-radius: 22px; background: transparent; color: inherit;
    font: 600 17px/1 system-ui, "PingFang SC", sans-serif; }
  .src-btn:hover { background: var(--m3e-sys-color-surface-container-high); }
  .src-btn .m3e-icon { font-size: 20px; color: var(--m3e-sys-color-on-surface-variant); }
  .srcmenu { position: absolute; z-index: 20; min-width: 220px; padding: 8px; border-radius: 20px; display: none;
    background: var(--m3e-sys-color-surface-container);
    box-shadow: 0 8px 28px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.10); }
  .srcmenu[data-open] { display: block; }
  .srcmenu button { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; height: 48px; padding: 0 14px; border: none; cursor: pointer; border-radius: 14px;
    background: transparent; color: inherit; font: 500 14px/1 system-ui, "PingFang SC", sans-serif; text-align: left; }
  .srcmenu button:hover { background: var(--m3e-sys-color-surface-container-highest); }
  .srcmenu button[aria-checked="true"] { background: var(--m3e-sys-color-secondary-container); }
  .srcmenu .m3e-icon { font-size: 20px; }

  .toolbar { flex: none; display: flex; gap: 12px; align-items: center; padding: 6px 16px 12px; }
  .searchbox { flex: 1; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px;
    border-radius: 26px; min-width: 0; background: var(--m3e-sys-color-surface-container-high);
    color: var(--m3e-sys-color-on-surface-variant); }
  .searchbox .m3e-icon { font-size: 22px; }

  /* 窄/中屏:一级分类做 Tab,二级做 chips */
  .cattabs { flex: none; display: flex; gap: 4px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
  .cattabs::-webkit-scrollbar { display: none; }
  .cattab { flex: none; height: 44px; padding: 0 16px; border: none; cursor: pointer; background: transparent;
    color: var(--m3e-sys-color-on-surface-variant); font: 600 14px/1 system-ui, "PingFang SC", sans-serif;
    border-bottom: 3px solid transparent; }
  .cattab[aria-selected="true"] { color: var(--m3e-sys-color-primary); border-bottom-color: var(--m3e-sys-color-primary); }

  .chips { flex: none; display: flex; gap: 8px; padding: 10px 16px 12px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .m3e-filter-chip { flex: none; }

  .scroll { flex: 1; overflow-y: auto; padding: 0 16px 96px; }
  .grid { display: grid; gap: 16px 14px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
  .card { cursor: pointer; }
  .poster { aspect-ratio: 2 / 3; border-radius: 18px;
    background: linear-gradient(160deg, hsl(calc(212deg + var(--h,0deg)) 40% 50%), hsl(calc(258deg + var(--h,0deg)) 46% 22%));
    transition: transform .18s cubic-bezier(.2,.9,.3,1.2), box-shadow .18s ease; }
  .card:hover .poster { transform: translateY(-3px) scale(1.015); box-shadow: 0 10px 24px rgba(0,0,0,.16); }
  .meta { padding: 10px 2px 0; display: flex; flex-direction: column; gap: 3px;
    align-items: center; text-align: center; }
  .meta b { font-size: 13px; font-weight: 600; }
  .meta span { font-size: 12px; color: var(--m3e-sys-color-on-surface-variant); }

  .view { display: none; }
  .view[data-on] { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; flex: 1; color: var(--m3e-sys-color-on-surface-variant); }
  .placeholder .m3e-icon { font-size: 48px; opacity: .5; }

  /* medium: rail 出现 */
  @media (min-width: 600px) {
    .rail { display: flex; width: 84px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
    .scroll { padding-bottom: 32px; }
  }
  /* expanded: 单列侧栏,顶部 Tab 藏起来 */
  @media (min-width: 840px) {
    .rail { display: none; }
    .side { display: flex; }
    .cattabs { display: none; }
    .topbar { padding: 12px 24px 4px; }
    .toolbar { padding-inline: 24px; }
    .scroll { padding-inline: 24px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  }
  @media (min-width: 1280px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
  }

  /* 真实数据用到的补充样式 */
  .poster { overflow: hidden; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .searchbox input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font: 500 15px/1 system-ui, "PingFang SC", sans-serif; color: inherit;
  }
  .searchbox input::placeholder { color: var(--m3e-sys-color-on-surface-variant); }
  #v-detail { overflow-y: auto; }
  .detail-head { padding: 8px 16px 0; }
  .detail-top { display: flex; gap: 18px; padding: 8px 16px 18px; align-items: flex-start; }
  .detail-top .hero {
    width: 132px; flex: none; aspect-ratio: 2 / 3; border-radius: 16px; overflow: hidden;
    background: var(--m3e-sys-color-secondary-container);
  }
  .detail-top .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-top h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; }
  .detail-top p { margin: 0; font-size: 13px; line-height: 1.65; color: var(--m3e-sys-color-on-surface-variant); }
  .eps { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 28px; align-items: center; }
  .chip-ep {
    height: 36px; padding: 0 14px; border-radius: 18px; cursor: pointer;
    border: 1px solid var(--m3e-sys-color-outline-variant);
    background: transparent; color: inherit; font: 600 13px/1 system-ui, "PingFang SC", sans-serif;
  }
  .chip-ep:hover { background: var(--m3e-sys-color-surface-container-high); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; word-break: break-all; max-width: 100%; }
  .placeholder span { max-width: 90%; }
</style>
</head>
<body>
<div class="app">
  <div class="body">
    <nav class="m3e-navigation-rail rail" aria-label="主导航">
      <button type="button" class="m3e-navigation-item" data-nav="home" aria-current="page">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">home</span>
          <span class="m3e-navigation-item__label">首页</span>
        </span>
      </button>
      <button type="button" class="m3e-navigation-item" data-nav="fav">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">favorite</span>
          <span class="m3e-navigation-item__label">喜欢</span>
        </span>
      </button>
      <button type="button" class="m3e-navigation-item" data-nav="settings">
        <span class="m3e-navigation-item__content">
          <span class="m3e-navigation-item__indicator" aria-hidden="true"></span>
          <span class="m3e-icon m3e-navigation-item__icon" aria-hidden="true">settings</span>
          <span class="m3e-navigation-item__label">设置</span>
        </span>
      </button>
    </nav>

    <aside class="side" id="side">
      <div class="side__brand">Reelbox</div>
      <nav class="side__nav" aria-label="主导航">
        <button class="side__item" data-nav="home" aria-current="page"><span class="m3e-icon">home</span>首页</button>
        <button class="side__item" data-nav="fav"><span class="m3e-icon">favorite</span>喜欢</button>
        <button class="side__item" data-nav="settings"><span class="m3e-icon">settings</span>设置</button>
      </nav>
      <div class="side__divider"></div>
      <div class="side__scroll" id="catlist"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="src-btn" id="srcBtn" aria-haspopup="true">
          <span id="srcName">加载中</span>
          <span class="m3e-icon" aria-hidden="true">arrow_drop_down</span>
        </button>
        <div class="srcmenu" id="srcMenu" role="menu"></div>
      </header>

      <div class="view" data-on id="v-home">
        <div class="toolbar">
          <div class="searchbox">
            <span class="m3e-icon" aria-hidden="true">search</span>
            <input id="q" placeholder="搜索影片" autocomplete="off">
          </div>
          <button class="m3e-button m3e-button--filled m3e-button--size-m" type="button" id="btnSearch">搜索</button>
        </div>
        <div class="cattabs" id="cattabs"></div>
        <div class="chips" id="childchips" style="display:none"></div>
        <div class="scroll" id="scroll">
          <div class="grid" id="grid"></div>
          <div class="empty" id="empty" style="display:none"></div>
        </div>
      </div>

      <div class="view" id="v-fav">
        <div class="placeholder"><span class="m3e-icon">favorite</span><b>还没有收藏</b><span>在详情页点 ♡ 收藏</span></div>
      </div>

      <div class="view" id="v-settings">
        <div class="placeholder"><span class="m3e-icon">settings</span><b>设置</b><span>源管理、播放器选项</span></div>
      </div>

      <div class="view" id="v-detail"></div>
    </div>
  </div>

  <div class="float-tabs m3e-floating-toolbar" role="toolbar" aria-label="主导航">
    <div class="m3e-floating-toolbar__bar">
      <button class="m3e-icon-button m3e-icon-button--standard" type="button" data-nav="home" aria-current="page" aria-label="首页">
        <span class="m3e-icon" aria-hidden="true">home</span>
      </button>
      <button class="m3e-icon-button m3e-icon-button--standard" type="button" data-nav="fav" aria-label="喜欢">
        <span class="m3e-icon" aria-hidden="true">favorite</span>
      </button>
      <button class="m3e-icon-button m3e-icon-button--standard" type="button" data-nav="settings" aria-label="设置">
        <span class="m3e-icon" aria-hidden="true">settings</span>
      </button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
